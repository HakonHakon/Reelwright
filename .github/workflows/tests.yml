name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Python packages
        run: python -m pip install -e ".[test]"
      - name: Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      # GPU work (ComfyUI, LatentSync) is mocked in the tests; WebKit runs only where it is installed
      - name: Tests
        run: python -m pytest -q tests -k "not webkit"
