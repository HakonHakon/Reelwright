<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reelwright</title>
<meta name="theme-color" content="#181a19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reelwright">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23181a19'/%3E%3Crect x='14' y='4' width='4' height='24' fill='%23d8341f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/studio.css">
<script>try { var t = localStorage.getItem("rw-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.5-1.9-.3-1 .4-2.1 1.5-2.1H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/></symbol>
    <symbol id="i-clapper" viewBox="0 0 24 24"><path d="M4 8h16v12H4zM4 8l2-4 4 .5L8 8M10 8l2-3.5 4 .5-2 3M16 8l2-3 2 .4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <a href="#/" class="logo"><span class="logo-mark"></span><span class="name" id="app-name">Reelwright</span></a>
    <nav id="nav"></nav>
    <div class="nav-spacer"></div>
    <div class="svc" id="status"></div>
    <div class="side-foot">
      <button class="icon-btn" id="theme-btn" title="Toggle theme"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="collapse-btn" title="Collapse sidebar ( [ )"><svg class="i"><use href="#i-panel"/></svg></button>
    </div>
  </aside>
  <div class="col">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" title="Menu" style="display:none"><svg class="i"><use href="#i-menu"/></svg></button>
      <nav id="crumbs"></nav>
      <button class="search-btn" id="search-btn"><svg class="i"><use href="#i-search"/></svg><span class="grow">Search or jump to…</span><span class="kbd">Ctrl K</span></button>
      <button class="icon-btn jobs-btn" id="jobs-btn" title="Activity"><svg class="i"><use href="#i-activity"/></svg><span class="badge" id="jobs-badge" hidden></span></button>
    </header>
    <main id="view"><div class="skel h1"></div><div class="skel row-card"></div><div class="skel row-card"></div></main>
  </div>
</div>

<button id="menu-backdrop" aria-label="Close navigation" hidden></button>
<nav class="mobile-nav" aria-label="App navigation">
  <a href="#/">Projects</a><button id="mobile-search">Search</button><button id="mobile-jobs">Activity</button><button id="install-app">Install app</button>
</nav>
<div class="network-status" id="network-status" role="status" hidden>Connection lost. Reconnect to your home network to save or render.</div>
<div class="toasts" id="toasts"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="jobs">
  <div class="drawer-head"><span class="grow" id="jobs-title">Activity</span><button class="icon-btn" id="jobs-close" title="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="jobs-list"></div>
</aside>
<div class="palette" id="palette" role="dialog" aria-label="Search">
  <input id="pal-input" placeholder="Search projects, episodes, characters, locations…" autocomplete="off" spellcheck="false">
  <div class="pal-list" id="pal-list"></div>
  <div class="pal-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div>
</div>
<div class="lightbox" id="lightbox">
  <button class="lb-nav lb-prev icon-btn" id="lb-prev"><svg class="i"><use href="#i-left"/></svg></button>
  <img id="lb-img" alt="">
  <button class="lb-nav lb-next icon-btn" id="lb-next"><svg class="i"><use href="#i-chev"/></svg></button>
  <button class="icon-btn lb-close" id="lb-close" style="color:#fff"><svg class="i"><use href="#i-x"/></svg></button>
  <div class="lb-bar"><span id="lb-count"></span><span class="kbd">← →</span><span class="kbd">Esc</span></div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Reelwright dialog"><div class="modal-body" id="modal-body"></div></div>
<script src="/static/studio.js"></script>
<script src="/static/episode.js"></script>
<script src="/static/app-install.js"></script>
</body>
</html>
